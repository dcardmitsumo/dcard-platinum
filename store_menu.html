<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="店頭提案">
<title>店頭提案ツール</title>
<style>
:root{
  --bg:#0b0c10; --panel:#15171d; --text:#fff; --muted:#b9bec8;
  --red:#e4002b; --blue:#2787ff; --yellow:#ffd84d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 0 calc(22px + env(safe-area-inset-bottom))}
header{padding:12px 22px 14px}
.kicker{font-size:12px;letter-spacing:.14em;font-weight:900;color:#a8adb7}
h1{font-size:30px;line-height:1.15;margin:8px 0 7px;font-weight:950}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.6}

.slider{
  display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 22px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.slider::-webkit-scrollbar{display:none}
.card{
  scroll-snap-align:center;flex:0 0 min(82vw,360px);min-height:480px;
  border-radius:28px;padding:24px;text-decoration:none;color:#fff;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 18px 45px rgba(0,0,0,.28);
}
.card:active{transform:scale(.985)}
.card::after{content:"";position:absolute;inset:auto -70px -90px auto;width:240px;height:240px;border-radius:50%;
background:rgba(255,255,255,.08)}
.card.dcard{background:linear-gradient(145deg,#201d19,#080808 64%)}
.card.hikari{background:linear-gradient(145deg,#073974,#09111f 68%)}
.card.denki{background:linear-gradient(145deg,#bd001f,#ed1745 58%,#8a0017)}
.num{font-size:12px;font-weight:900;letter-spacing:.12em;opacity:.75}
.icon{font-size:52px;margin:34px 0 22px}
.title{font-size:36px;font-weight:950;letter-spacing:-.03em;margin:0 0 12px}
.desc{font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);margin:0;max-width:280px}
.spacer{flex:1}
.open{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:24px;padding:15px 16px;border-radius:15px;
  background:rgba(255,255,255,.13);font-size:14px;font-weight:900;
  backdrop-filter:blur(8px)
}
.dcard .open{background:#f4d66f;color:#111}
.hikari .open{background:#fff;color:#0a55ad}
.denki .open{background:#fff;color:#c90028}
.dots{display:flex;justify-content:center;gap:7px;margin-top:-12px}
.dot{width:7px;height:7px;border-radius:999px;background:#484d56}
.hint{text-align:center;color:#8d939e;font-size:11px;margin:14px 20px 0}
@media(min-width:900px){
  .slider{justify-content:center;overflow:visible}
  .card{flex-basis:300px;min-height:450px}
}
</style>
</head>
<body>
<header>
  <div class="kicker">DOCOMO STORE TOOL</div>
  <h1>何をご提案しますか？</h1>
  <p class="sub">横にスワイプして、使いたいツールをタップ。</p>
</header>

<main class="slider" id="slider">
  <a class="card dcard" href="dcard_sales_simulator_v16_4_rebuilt_clean.html">
    <div class="num">01 / d CARD</div>
    <div class="icon">💳</div>
    <h2 class="title">dカード</h2>
    <p class="desc">dカード・GOLD U・GOLD・PLATINUMの店頭提案、ポイント・料金比較へ。</p>
    <div class="spacer"></div>
    <div class="open"><span>dカードを開く</span><span>→</span></div>
  </a>

  <a class="card hikari" href="dcard_sales_simulator_v16_4_rebuilt_clean.html#page2">
    <div class="num">02 / HIKARI</div>
    <div class="icon">🌐</div>
    <h2 class="title">光</h2>
    <p class="desc">ドコモ光・他社からの乗り換え提案へ。現在のdカードシミュレーター内「ページ2」を使用します。</p>
    <div class="spacer"></div>
    <div class="open"><span>光を開く</span><span>→</span></div>
  </a>

  <a class="card denki" href="denki_simulator_store.html">
    <div class="num">03 / DENKI</div>
    <div class="icon">⚡</div>
    <h2 class="title">電気</h2>
    <p class="desc">現在契約とドコモでんき Basic / Green を比較。店頭向け電気料金シミュレーター。</p>
    <div class="spacer"></div>
    <div class="open"><span>電気を開く</span><span>→</span></div>
  </a>
</main>

<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<p class="hint">iPhoneはカードを横にスワイプできます</p>
</body>
</html>
